name: gh release test
on:
  pull_request:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: gh release test
        run: |
          gh release list --repo microsoft/vscode | head -n 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}